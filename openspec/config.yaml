schema: spec-driven

# All OpenSpec artifacts (proposals, designs, specs, tasks) MUST be written in English.

context: |
  # SolarWave — project context and decision log

  Lead qualification platform for a residential solar company. A bilingual
  (PT/EN) landing page captures leads; an AI voice agent calls and qualifies
  them; employees review results and configure criteria in an internal portal.
  Functional spec: `solar-lead-qualification-spec.md` (repo root). The spec is
  the baseline; the decisions below extend or override it where noted.

  ## Purpose and scope
  - Built for DEMONSTRATION, not for commercial sale. Free tiers and the Vercel
    Hobby plan are acceptable. Never call real customers with real data in demos.
  - NO EXECUTION COSTS (project owner, 2026-09-06). Nothing in this project may
    incur a bill: no paid Gemini realtime tier, no paid Twilio number, no
    Brazilian regulatory bundle, no paid scheduler or queue product. This closes
    the two "price it and decide" questions `voice-bridge` left open, and it
    means a blocker that only money would clear is written down as a limit
    rather than bought out. Where a free tier cannot carry a feature, the
    README says so instead of implying otherwise.
  - Phase 1 is Brazil-only for phone numbers (+55). Timezone is derived from the
    DDD (area code). Both call languages (pt default, en) remain available.
  - The highlight of the product is the automation: scheduling, the LLM voice
    call and the LLM-assisted qualification. Give those parts the most care.

  ## Repository state (2026-09-06)
  - pnpm monorepo. `apps/web` = Next.js 16 (App Router, React 19), plus
    `packages/core` (pure domain rules), `packages/db` (Drizzle + Supabase),
    `packages/ai` (AI SDK adapters), `packages/scoring` (the worker) and
    `packages/agent` (the conversation agent).
  - Done: database and migrations, Supabase Auth, Turnstile, DB-backed rate
    limiting and dedup, the portal on real data, criteria CRUD with audit, the
    deterministic scoring engine, the scoring worker (extraction, narrative,
    guardrail judge, recomputation), and the conversation agent in text (script
    assembly, tool contract, loop, question linter, persona eval, simulated
    calls from the portal).
  - BUILT in change 5 (2026-09-08): `leadWorkflow` on the Workflow SDK, started
    by intake and by an admin action, sleeping until `next_call_at` and
    dispatching through the same `dispatchCall` a person uses. The lead-requested
    callback (two columns, resolved by the extraction pass, applied by scoring).
    ONE daily maintenance route — transcript purge, stale-attempt reconciliation,
    recovery of scoring that never finished, and a sweep of leads overdue by more
    than an hour — whose own database access is the Supabase keep-alive. An
    AUDITED dispatch budget that ships OFF. Cost per call recorded in telephony
    and realtime seconds. A leads dashboard that polls while a call is in flight.
    `workflow_run_id` finally has a writer.
  - `packages/voice` IS built: the Gemini Live session, the audio conversion,
    Twilio dispatch, the webhooks, the media bridge, the browser harness and the
    voice eval. No telephone has yet carried a conversation through it.
  - Changes 1-4 are archived; the spec baseline is 21 capabilities under
    `openspec/specs/`. `voice-bridge` archived as SOFTWARE and not as telephony:
    it was complete in code and twenty-four of its tasks were external
    measurements, so they moved to a change of their own rather than holding
    eight finished capability specs out of the baseline. The browser harness at
    `/portal/harness` holds a real conversation.
  - Two changes are active: `lifecycle-and-operations` (change 5, next) and
    `real-call-proof` (change 6, LAST). Change 6 exists because the project
    owner deferred real-call testing to the end of development on 2026-09-05;
    it holds every claim that needs a connected telephone, plus one piece of
    instrumentation.
  - Two things block the first real call, both written up in the change's
    tasks. (1) The realtime session is INTERMITTENT — section 7b — and the
    measurement says it is a free-tier realtime limit rather than anything
    acoustic. (2) Twilio's API reports no owned number and no verified caller
    id on the account, although its own console panel places calls.
  - No migration was needed for the whole of change 4. `call_attempts` already
    carried `twilio_call_sid` behind a unique index, which is what makes
    completion idempotent under Twilio's retries.
  - Demo transcripts and their hand-written expected answers live in
    `packages/db/src/seed/data.ts`, exported as the golden set through
    `@solarwave/scoring`. `apps/web/src/lib/leads.ts` is presentation helpers
    only and holds no records.
  - Integration tests run on PGlite when no DATABASE_URL is reachable, so they
    need no server (`packages/db/src/test/harness.ts`).

  ## Target architecture (decided)
  Everything runs on Vercel (Hobby). No separate always-on service.

    POST /api/leads -> start(leadWorkflow, [leadId])          (Vercel Workflow)
       loop attempts (max 3):
         sleep until next_call_at (08:00-22:00 in the lead's DDD timezone)
         step: Twilio calls.create (Answering Machine Detection on)
         hook: wait for "call.ended"  <- /api/twilio/status (status callback)
                                      <- /api/media (WebSocket <-> Gemini Live)
         step: scoring (extract -> deterministic engine -> reason/icebreaker -> judge)
         qualified | disqualified | opt_out -> exit
         no_answer | busy | voicemail | failed | answered_incomplete -> sleep 15m / 2d

  - Scheduler = the Workflow SDK. MEASURED 2026-09-06 against Vercel's own
    limits page (lifecycle-and-operations spike 1.3), and it corrects the reading
    this log used to carry: Hobby includes 50k workflow events/month and 1 GB
    written; "Maximum run duration" is NO LIMIT and "Maximum sleep duration" is
    NO LIMIT; the 1-day figure is RETENTION OF THE EVENT LOG AFTER A RUN
    COMPLETES, not a cap on a live run. A run that is asleep is not reaped by it,
    so the spec's 2-day retry is an ordinary `sleep` and needs no fallback.
    Other run limits: 25,000 events and 10,000 steps per run, 240 s max replay.
    A step produces three events, so a lead that goes to three attempts costs
    well under a hundred — a demo is nowhere near the monthly allowance, and on
    Hobby exceeding it stops the feature rather than producing a bill.
  - MEASURED: the SDK runs under BOTH `next dev` and `vercel dev` — the builder
    runs, a `sleep` suspends and resumes, and a step reaches Postgres. Unlike the
    media bridge, the scheduler puts NO constraint on the local development loop.
    Two traps found while measuring: a step may only import what `apps/web`
    itself depends on (the builder bundles step files with esbuild from there, so
    `drizzle-orm` does not resolve — go through the `@solarwave/db` barrel), and
    local run state lives in `apps/web/.next/workflow-data`, so `rm -rf .next`
    destroys sleeping local runs.
  - CORRECTED for change 5: the package is `workflow` (with `workflow/next` and
    `workflow/api`), NOT `@vercel/workflow`, and a `"use workflow"` function runs
    in a sandboxed VM with no Node built-ins — so every database touch must sit
    in a `"use step"` function. Read `node_modules/workflow/docs/` rather than
    trusting the note above.
  - SUPERSEDED by lifecycle-and-operations design D1: the scheduler uses `sleep`
    ONLY and no hooks. A hook would wake the run the instant a call ended instead
    of about four minutes later, and the next thing the run does is sleep for at
    least fifteen minutes, so the saved time is invisible. A hook also has to
    race a timeout regardless, because a status callback can be lost. The
    decisive reason: something must call `resumeHook`, and the only thing that
    knows a call ended is the status callback route that `real-call-proof` is
    about to measure. The scheduler must not perturb the instrument.
  - Vercel Cron on Hobby runs at most once per day (+/-59 min), and a cron
    expression that would run more often FAILS AT DEPLOYMENT rather than being
    downgraded. MEASURED 2026-09-06: the job COUNT is not scarce — Hobby allows
    100 cron jobs per project, so an earlier note here claiming otherwise was
    wrong. Change 5 still consolidates ALL periodic work into ONE authenticated
    route, on its own merits (same cadence, no interdependence, one secret
    instead of four, and the keep-alive falls out of any job that touches the
    database): the 12-month transcript purge, the stale-attempt
    reconciliation, the recovery of attempts whose scoring never finished, and a
    sweep of leads overdue by more than an hour. There is no separate Supabase
    keep-alive job — a daily job that reads and writes the database IS the
    keep-alive, and a separate cron slot would spend a scarce Hobby resource to
    do less.
  - Voice bridge = Next.js route using `experimental_upgradeWebSocket` from
    `@vercel/functions` (WebSockets in Functions are public beta, need Fluid
    Compute, connection closes at the function max duration = 300s on Hobby).
    Fallback if the beta bites: a small Fastify service on Fly.io for the bridge only.
  - Twilio Media Streams sends 8 kHz mu-law; Gemini Live takes 16 kHz PCM16 in
    and returns 24 kHz PCM16. Resample both ways in the bridge. On model
    interruption (barge-in) send Twilio a `clear` to flush buffered audio.

  ## LLM decisions
  - Provider: Google Gemini, free tier (only provider with a free realtime voice API).
  - Voice model: Gemini 2.5 Flash Native Audio (free for audio in/out; supports
    async function calling NON_BLOCKING, input+output transcription, barge-in,
    configurable VAD, pt among 97 languages). Do NOT use 3.1 Flash Live Preview
    (charges audio input on free tier, sequential-only tools). Exact model IDs
    are preview and must be verified at implementation time.
  - Text models (scoring extraction, reason/icebreaker, guardrail judge,
    question linter, simulated leads for evals): Gemini Flash (non-realtime,
    satisfying spec section 4.6 "a different, non-realtime model").
  - Model roles use TWO env prefixes, not one: `SCORING_MODEL_*` for extraction,
    narrative and judge; `AGENT_MODEL_*` for conversation, persona and linter.
    A rename was rejected as pure churn that would break every existing
    `.env.local` and Vercel setting (conversation-agent-text design D3).
  - SDKs: Vercel AI SDK (`ai`) with AI Gateway "google/<model>" strings for
    everything text/structured-output. `@google/genai` Live client ONLY for the
    realtime call (AI SDK does not cover bidirectional realtime audio). Never
    trust memory for AI SDK APIs; read `node_modules/ai/docs/`.
  - VERIFIED 2026-09-05: the Vercel AI Gateway is NOT usable on a free account.
    It refuses every request, free credits included, until a payment method is
    on file ("AI Gateway requires a valid credit card on file to service
    requests"). DECIDED: text calls go to Google AI Studio directly with a free
    key (`@ai-sdk/google`, env var GOOGLE_GENERATIVE_AI_API_KEY, no card).
    Pin `@ai-sdk/google@3.0.121`; v4 needs a newer provider spec than ai@6 has.
  - Consequence: free-tier terms allow Google to use content to improve their
    products, for the text calls as well as the realtime one. Acceptable for a
    demo only; a paid tier is required before any real customer data.
  - Model ids are PLAIN, with no provider prefix: `gemini-3.8-flash`, never
    `google/gemini-3.8-flash`. List them rather than trusting memory:
    curl -H "x-goog-api-key: $GOOGLE_GENERATIVE_AI_API_KEY"       "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200"
  - Both halves of the product now use the same provider and key: text through
    @ai-sdk/google, realtime audio through @google/genai.
  - MEASURED 2026-09-05 (voice-bridge spike, `packages/voice/src/spike/live.ts`,
    @google/genai 1.52.0), and it overrides the paragraph above: PIN
    `gemini-2.5-flash-native-audio-preview-09-2025`. It is the ONLY native-audio
    id on the free key where function calling works. The newer
    `preview-12-2025` produces audio and transcription correctly and then kills
    the socket with 1011 "Internal error occurred" the moment the model tries to
    call a function — reproduced with all five tools and with one minimal tool,
    so it is the model and not our declarations. `-latest` currently aliases
    12-2025 and is therefore broken too: never use the floating alias.
  - MEASURED: output audio is `audio/pcm;rate=24000`, mono PCM16, matching the
    24 kHz the architecture section assumed. Output transcription arrives in
    Portuguese without extra configuration. Input transcription is untested
    until the browser harness supplies real speech.
  - MEASURED: `toFunctionDeclarations()` is accepted AS IS. The `$schema` and
    `additionalProperties` keys that `z.toJSONSchema()` emits do not need
    stripping, so change 3's projection needs no change. Sanitizing them was
    tried and was not what fixed anything.
  - MEASURED, and the loop must tolerate it: the model omits required
    arguments. `record_answer` arrived with `criterion_key` and no `value`;
    `end_call` arrived with no `reason`. `readAnswer` and `readReason` in
    `loop.ts` already default rather than guess, which is why this is a note
    and not a bug.
  - MEASURED: pushing `sendClientContent` while the model is still generating
    also produces a 1011. On a real call, lead audio goes through
    `sendRealtimeInput`, which is built for that; client content is only for
    injected instructions such as the wrap-up, and must wait for `turnComplete`.
  - MEASURED 2026-09-05, and this supersedes an earlier reading that blamed
    pacing: the Gemini free tier appears to have a DAILY realtime allowance,
    and this account exhausted it. Evidence, in order through one day:
    the first spike sessions worked perfectly (182 audio chunks, full
    transcription, tool calls); a probe run alone answered in 35 s and held;
    a thirteen-probe pass four seconds apart held four; the SAME pass thirty
    seconds apart held ZERO; and the original spike script — independent code
    that had worked that morning — then returned no audio, no transcription and
    no tool call at all, closing cleanly with 1000. Widening the gap made it
    worse, so the gap was never the variable. Roughly forty realtime sessions
    had been opened by then.
  - Consequence, and it is a demo-level one: the free tier may not sustain the
    handful of real calls the demo needs, let alone debugging them. The
    unmeasured cost of a paid realtime tier is now on the critical path.
  - A refused realtime session is unmeasured, never a guardrail failure. Any
    report that scores one as a violation is lying about the agent.
  - MEASURED: even alone, a single turn from this model takes tens of seconds
    on the free tier. Any claim about conversational latency has to be made
    against a paid tier, not this one.
  - Transcripts come from Gemini Live input/output transcription. Call audio is
    never stored (spec section 10).

  ## Conversation design decisions
  - Learned the hard way in change 3, and it applies to change 4 too: an
    assistant turn's TOOL CALLS must be appended to the message history along
    with a result for each one. A model that cannot see its own tool calls
    re-issues them silently until whatever turn cap exists runs out. Unit tests
    with a scripted model do not catch this; only a real conversation does.
  - The script is DRIVEN BY THE ACTIVE CRITERIA. The system prompt is assembled
    at call time from active criteria. Fixed, non-editable frame: AI disclosure,
    permission to ask, tone rules, all section 6 guardrails, closing. Criteria
    fill only the middle.
  - Each criterion carries `question_pt`, `question_en`, `type`
    (boolean|numeric|enum|free_text), `expected_value` (rule the engine
    evaluates), `weight`, `blocking`, `active`.
  - Tone guardrail: questions must never insult or judge the lead. Criterion
    type constrains phrasing; the agent never asks the lead to justify a
    negative answer. A cheap LLM "question linter" runs when an employee saves
    a criterion and warns about tone or guardrail conflicts (e.g. a credit
    pre-check collides with "no financial advice / no sensitive data").
  - Ordering: blocking criteria first, then by descending weight. A failed
    blocking criterion ends the call politely with an alternative (e.g.
    community-solar waitlist) instead of continuing.
  - Call duration: target 2 minutes, stated in the prompt. Bridge injects a
    "wrap up courteously on your next turn" instruction at 90 s and hard-stops
    the call at 3 minutes. Portal shows a question budget and warns when active
    criteria exceed roughly 5-6 questions.
  - Live tools available to the agent: record_answer(criterion_key, value),
    request_callback(preferred_time), mark_opt_out(), flag_minor(),
    end_call(reason). Live record_answer is advisory (controls flow and
    early exit); the post-call extraction is the source of truth.
  - "Enough information" (spec section 4.5) = all active blocking criteria
    answered AND at least a configurable share of active weight answered.
    Otherwise the attempt outcome is `answered_incomplete` and counts as
    no-answer for retry.
  - Hostile/abusive lead -> end gracefully and set status `disqualified`
    directly (no retry), outcome `abusive`. Minor answered -> end, outcome
    `minor_answered`, retry per spec. Opt-out -> immediate DB write, call ends,
    status `opt_out`, terminal; overrides everything (spec section 6). An
    opted-out phone re-submitting the form must NOT be re-scheduled.

  ## Scoring decisions
  - Score is DETERMINISTIC and reproducible. LLM extracts structured answers
    (value, confidence, evidence quote) using a JSON schema generated from the
    active criteria. The engine in `packages/core` applies `expected_value`,
    weights, blocking and the threshold. Only extraction, reason/icebreaker
    prose and the guardrail judge are LLM calls.
  - Hand-off threshold (currently 70) becomes a persisted, audited setting.
  - Guardrail judge: post-call LLM pass flags section 6 violations into a
    `guardrail_violations` table shown in the portal. Belt-and-braces check for
    opt-out intent in the transcript as well.
  - Re-scoring past transcripts after criteria changes must be possible.

  ## Data decisions
  - MEASURED 2026-09-06 (lifecycle-and-operations spike 1.5), and it OVERRIDES
    the "Supabase Realtime for the live dashboard" line below: the
    `supabase_realtime` publication exists and is EMPTY, RLS is disabled on all
    nine tables and there are ZERO row-level policies. Realtime therefore
    delivers nothing today, and making it deliver means adding `leads` to that
    publication — where Postgres Changes are authorised by RLS. With no RLS and
    no policies that pushes every lead insert and update, names and emails and
    phone numbers included, to anyone holding NEXT_PUBLIC_SUPABASE_ANON_KEY, a
    key that ships to every browser loading the public landing page. DECIDED: the
    live dashboard POLLS while any lead is `calling` and stops when none is. RLS
    is not opened for a dashboard convenience; if it is ever wanted for its own
    sake it is its own change.
  - Database: Supabase Postgres. Supabase is NOT in the Vercel Marketplace CLI
    catalog (`vercel integration add supabase` fails, verified 2026-09-04), so
    the project is created at supabase.com and its keys are pasted into
    `apps/web/.env.local` and the Vercel project env vars by hand.
    Drizzle ORM for schema and migrations (domain code stays vendor-neutral).
    Supabase Auth for employee login (roles agent|admin). Supabase Realtime for
    the live dashboard (`calling` state). Daily cron ping prevents free-tier pause.
  - Schema = spec section 8 plus: criteria `blocking`, `question_pt`,
    `question_en`, `expected_value` semantics per type; `settings` table
    (threshold, min answered weight share); leads `next_call_at`,
    `attempt_count`, `opt_out_at`, `workflow_run_id`; call_attempts
    `twilio_call_sid`, `scoring_status`; qualification_answers
    `normalized_value` (jsonb), `confidence`, `evidence`, `passed`;
    `guardrail_violations` table; employees linked to Supabase Auth users.
  - Outcome enum extended: answered_complete, answered_incomplete, no_answer,
    voicemail, busy, failed, abusive, minor_answered, opt_out.
  - Rate limiting/CAPTCHA: Cloudflare Turnstile + Postgres-based or Vercel
    Firewall rate limit (no Redis needed for the demo).
  - Phone normalisation via libphonenumber-js with +55 default.

  ## Development strategy (de-risking without telephony)
  1. Scoring worker first, tested against the demo transcripts already in
     `apps/web/src/lib/leads.ts` (ready-made fixtures).
  2. Conversation agent in TEXT with a second LLM playing lead personas
     (hostile, minor, asks price, renter, opt-out, chatty). Eval suite covering
     every section 6 guardrail and the 2-minute budget.
  3. Browser-microphone harness against the bridge and Gemini Live.
  4. Twilio last. Trial gives about 75 voice minutes for 30 days, only 5
     verified numbers, sign-up country only. Budget is about 35 two-minute calls.

  ## Planned changes (in order)
  1. persistent-foundations — packages/db (Drizzle + Supabase), packages/core
     (phone, DDD->tz, call window, retry, scoring engine, state machine, tests),
     intake on DB with unique phone index + workflow start, portal on DB,
     criteria CRUD + audit persisted, employee auth, threshold setting.
  2. scoring-worker — DONE. Extraction under a criteria-derived schema, engine
     wiring, reason/icebreaker, guardrail judge, manual recomputation, golden
     fixtures. Split the enum `options` vocabulary from the `expected_value`
     pass rule; `packages/ai` and `packages/scoring` were added here.
  3. conversation-agent-text — DONE. Script assembled from criteria behind a
     fixed guardrail frame, a provider-neutral tool registry projected to both
     the AI SDK and Gemini Live, the conversation loop, the fail-open question
     linter, the persona eval (probes + scripted flows, ~39 requests), and
     simulated calls persisted as real attempts. `packages/agent` was added
     here. No migration.
  4. voice-bridge — ARCHIVED 2026-09-06 as software, not as telephony. Twilio webhooks, Media Streams WS, Gemini Live,
     resample, barge-in, transcript capture, 90 s / 3 min timers, AMD, status
     callbacks. Shaped as two halves that fail for separable reasons: the
     realtime session, verified from a browser-microphone harness with zero
     telephony, and the Twilio transport on top of it. `packages/voice` is added
     here, holding the session and the audio conversion so the Fly.io fallback
     swaps only the host. No migration.
  5. lifecycle-and-operations — BUILT 2026-09-08, 46/49 tasks. Scoped against the code, which
     narrowed it: the retry intervals, the call window and `no_answer_final` are
     ALREADY built, pure and tested, so the change executes them rather than
     writing them. What is actually new: `leadWorkflow` (sleep-only, no hooks,
     every I/O a step); the lead-requested callback (two columns, resolved by the
     extraction pass that already reads every transcript, applied by the scoring
     worker so it works with the scheduler switched off); ONE daily maintenance
     job (purge + reconcile + scoring recovery + overdue sweep, its own database
     contact being the keep-alive); an AUDITED dispatch budget that ships OFF,
     because this change removes the human who had to click before a free-tier
     allowance could be spent; cost per call measured in the currencies that
     actually run out — telephony seconds and realtime seconds, not money; and a
     dashboard that shows a call happening. One additive migration, the first
     since change 1.
  6. real-call-proof — LAST, deferred by the project owner on 2026-09-05. The
     twelve claims only a connected telephone can settle, the Twilio number and
     verified caller ID, the Gemini realtime allowance, and one piece of
     instrumentation: a timestamped provider event log behind a debug flag that
     carries no audio and no transcribed words. Under the no-cost constraint a
     blocked account is a deliverable — if the free tiers cannot carry a
     connected call, the demo runs on the harness and simulated calls and the
     README says exactly that.

  ## Measured in change 5 (lifecycle-and-operations)
  - The scheduler uses `sleep` ONLY, no hooks (design D1), overriding the
    `createHook`/`resumeHook` note above. A hook would wake the run the instant a
    call ended instead of ~4 minutes later, and the next thing it does is sleep
    for at least fifteen minutes — so the saving is invisible. The decisive
    reason: something must call `resumeHook`, and the only thing that knows a
    call ended is the Twilio status callback that `real-call-proof` still has to
    measure. The scheduler must not perturb the instrument.
  - The run writes NO lifecycle state. Four authorities, disjoint: the status
    callback says how an attempt ended, scoring says what the transcript said and
    whether the lead qualified, `dispatchCall` says whether a call may be placed,
    and the run only says WHEN to ask. The run id is written by the STARTER, so
    the workflow writes nothing at all. Turn the switch off or delete the module
    and the system is exactly what it was.
  - THE BRAKE, and it ships OFF: `auto_dispatch_enabled` (default false) gates
    the run only; `daily_call_budget` (10) and `monthly_voice_seconds_budget`
    (4500 = the Twilio trial's 75 minutes) gate EVERYONE, an admin included —
    because the way the realtime allowance was actually exhausted in change 4 was
    a person opening ~40 sessions in a day. All three are rows in the existing
    key/value `settings` table, so they inherit the audit trail: enabling
    automatic dispatch is a recorded act with a name on it.
  - MEASURED, and it was a real bug caught before a call was placed: the budget
    is a GLOBAL aggregate, so two dispatches for DIFFERENT leads lock different
    rows, never serialise, both read the same count and BOTH PASS. Classic write
    skew; the concurrency test caught it. Fixed with `pg_advisory_xact_lock`
    taken immediately before the budget read — transaction-scoped, taken last,
    deadlock-free because lead locks are disjoint and this global resource is
    acquired after them.
  - Cost is measured in the currencies that RUN OUT, not money: `telephony_seconds`
    from the provider's `CallDuration`, and `realtime_seconds` as OBSERVED by the
    bridge (not provider metering, and the portal says so). Simulated attempts
    count against neither budget.
  - VERIFIED 2026-09-08 against the running app with automatic dispatch ON, the
    call window OPEN and Twilio configured — the only thing between the system
    and a real telephone call was the budget, and it refused:
    `{"status":"refused","reason":"budget_exhausted","detail":"daily_calls: 0/0"}`.
    Opt-out verified the same way: re-submitting the intake form for an
    opted-out phone returns `existing` with `nextCallAt: null`, and dispatch is
    refused `opted_out`.
  - MEASURED: the extraction schema must make the callback field UNFAILABLE. As a
    required object, a model that merely OMITTED it failed structured-output
    validation and took every criteria answer down with it. Now
    `z.unknown().optional()`, with the shape in the description and the prompt and
    the enforcement in code — the same principle `confidence` already used.
  - MEASURED: the model is asked for a LOCAL WALL CLOCK (`YYYY-MM-DDTHH:mm` in the
    lead's timezone), never an instant. `localToInstant` already does the offset
    arithmetic correctly, DST included; asking an LLM to do it invites the error.
  - OPERATIONAL, and it wastes an afternoon otherwise: the integration suites
    TRUNCATE the shared database when DATABASE_URL points at a real server. Run
    `pnpm db:seed` afterwards, or the next dispatch refuses `no_active_criteria`
    for reasons unrelated to the code.
  - BLOCKED UPSTREAM: `@workflow/vitest` cannot run here — the Local World's queue
    fails every enqueue with `builtin-modules.json needs an import attribute of
    "type: json"` (a transitive dependency of `@workflow/builders`, reproduced on
    5.0.0 and 5.3.0). Affects ONLY the in-process test runtime; `next dev` and
    `vercel dev` both run workflows correctly. The orchestration suite is written
    and gated behind WORKFLOW_ORCHESTRATION_TESTS=1.

  ## Open questions (settle inside the relevant change's design.md)
  - SETTLED by scoring-worker (design D2): the lead stays `calling` while its
    attempt is scored. No `scoring` status was added; `call_attempts.scoring_status`
    carries the machine-facing detail.
  - SETTLED by conversation-agent-text: the call order is DERIVED (blocking,
    then descending weight, then `sort_order`, then key) and is separate from
    the `sort_order` order the portal lists criteria by; the portal shows a
    preview of the real call order so the two cannot silently disagree.
  - SETTLED by conversation-agent-text: the hostile-exit budget is 2 turns after
    the first hostile utterance, measured rather than invented (`EVAL_HOSTILE_TURNS`).
  - SETTLED by voice-bridge (design D4): the Twilio STATUS CALLBACK is
    authoritative for how an attempt ended, not the media WebSocket. The bridge
    persists its transcript incrementally and publishes what it knows; the
    callback writes `ended_at`, the outcome and the transition, and
    `reconcileStaleAttempts` is the backstop. The alternative left leads stuck
    in `calling` with a null `ended_at`, which `attempt_in_flight` then reads as
    a running call and refuses every future attempt, silently and forever.
  - SETTLED by voice-bridge (design D3): the end-reason-to-outcome mapping and
    the live-answer bookkeeping live in ONE transport-neutral module in
    `@solarwave/agent`, used by the text loop and the voice session.
    `outcomeFor` was private to `loop.ts`; a second copy in the bridge would
    have made a text call and a voice call that ended the same way retry
    differently.
  - SETTLED by voice-bridge (design D5): before `leadWorkflow` exists, a call is
    triggered by an admin action on the lead detail and by a secret-guarded
    `POST /api/internal/call`, sharing one `dispatchCall`. Opt-out, in-flight
    and attempt-cap are refused INSIDE the transaction that inserts the attempt,
    because losing that race places a telephone call that cannot be recalled.
  - SETTLED by lifecycle-and-operations (design D6): callback-requested gets two
    columns on `call_attempts` — the verbatim phrase and the resolved instant.
    The phrase is resolved by the EXTRACTION pass that already runs one model call
    over every transcript (a second call would be a second failure mode for
    information the first is already reading), and applied by the SCORING WORKER
    rather than by the scheduler, because automatic dispatch defaults to off and
    a feature that only works once someone enables the robot is off in the default
    demo. Bounded because an LLM produced it: future, within a horizon, clamped
    into the 08:00-22:00 window, never on a terminal lead and NEVER on an
    opted-out one. Fail any bound and the interval policy stands. The verbatim
    phrase is stored and shown either way. No agent change, exactly as predicted.
  - SETTLED by voice-bridge (design D13): Twilio's webhook signature is computed
    with the account AUTH TOKEN, and this project authenticates with an API key
    so a deployment credential stays revocable. There is no API-key variant. The
    webhook URLs therefore carry a token we mint, bound to the attempt, and the
    provider signature is verified in addition whenever an auth token is set.
  - SETTLED by voice-bridge (task 2.5): Vercel's deployment protection covers
    the generated URLs but NOT the production domain, which answers 200 and
    reaches the app. Twilio talks to production and nothing is disabled — but
    that makes the webhooks' own locks the only ones there are.
  - MEASURED 2026-09-06: a Twilio TRIAL rejects the WHOLE call request when it
    carries a parameter it is not entitled to, with "Invalid or disallowed
    parameters provided". Probed with an unverified destination, so nothing was
    placed: To, From, Url, StatusCallback and StatusCallbackEvent are accepted;
    StatusCallbackMethod, TimeLimit, MachineDetection and AsyncAmd are refused.
    `TWILIO_TRIAL_ACCOUNT` defaults to true and drops the refused set. Losing
    StatusCallbackMethod costs nothing (POST is its default); losing the other
    three costs answering-machine detection and the provider-side duration
    limit, and both consequences are written on the flag.
  - Whether the Twilio trial announcement/verification limits force a paid
    upgrade before the demo: the "paid upgrade" half is SETTLED — the no-cost
    constraint above forbids it. What remains is whether the free trial can carry
    a connected call at all, which `real-call-proof` answers, and if it cannot the
    demo moves to the harness. Originally raised as voice-bridge task 3.
    Trial numbers are limited to the sign-up country and Brazilian local numbers
    need a regulatory bundle, so the answer may be "demo on the harness". The
    announcement itself plays before the AI disclosure; the disclosure is still
    the agent's first utterance, so the guardrail holds as specified.

  ## Conventions
  - VERIFY WITH `pnpm build`, not just typecheck/lint/test. Only the build
    exercises the server/client module boundary. Learned in change 3: a Client
    Component imported the `@solarwave/agent` barrel, which re-exported the one
    module touching `@solarwave/db`, and the postgres driver landed in the
    browser bundle where `fs`/`net`/`tls` do not resolve. Every other check was
    green. If the build reports a TurbopackInternalError after a failed run,
    delete `apps/web/.next` before believing it.
  - A package barrel (`index.ts`) must stay client-safe. Anything importing
    `@solarwave/db`, a driver or a node builtin goes behind an explicit subpath
    export instead, so a Client Component cannot reach it by accident:
    `@solarwave/agent/simulate` is server-only; `./criteria` and `./personas`
    are pure and client-safe.
  - TypeScript everywhere, pnpm workspaces, Drizzle, Vitest for `packages/*`.
  - Conventional commits (feat:, fix:, chore:, ...).
  - Next.js 16 has breaking changes vs. training data: read
    `apps/web/node_modules/next/dist/docs/` before writing Next code.
  - Deterministic logic lives in `packages/core` and must be unit-tested
    without any LLM call. LLM calls live behind small adapters so models can be
    swapped and mocked.
  - Docs, specs, code comments and commit messages in English. UI copy is
    bilingual PT/EN.

rules:
  proposal:
    - Written in English.
    - Include a "Non-goals" section and reference the spec sections touched.
    - State which parts of the change are deterministic and which call an LLM.
  design:
    - Written in English.
    - Record any open question from the config context that this change settles, with the decision and rationale.
    - Call out free-tier / Hobby-plan limits that constrain the design.
  specs:
    - Written in English. Requirements use SHALL/MUST with Given/When/Then scenarios.
    - Every guardrail from spec section 6 that the change touches gets its own scenario.
  tasks:
    - Written in English. Tasks small enough to complete in about 2 hours each.
    - Include tests for packages/core logic and eval fixtures for LLM behaviour where relevant.
